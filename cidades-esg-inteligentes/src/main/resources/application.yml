spring:
  application:
    name: cidades-esg-inteligentes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cidades_esg}
    username: ${DB_USER:esg_user}
    password: ${DB_PASSWORD:esg_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: Cidades ESG Inteligentes
    version: 1.0.0
    description: API de indicadores ESG municipais

app:
  seed:
    enabled: ${SEED_DATA:true}
